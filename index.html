<style>
:root{--sidebar:244px;--accent:#267660;--accent-soft:#edf5f1;--line:#e5e8eb;--muted:#7e8690;--surface:#f7f8fa;--ink:#22262b;--card:#fff;--topbar:#fff}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--surface);color:var(--ink);font-feature-settings:"tnum" 1,"cv05" 1;font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,a:focus-visible{outline:3px solid #94b6a8;outline-offset:3px}
input,textarea,select{min-width:0}
.hidden{display:none!important}
.ico{display:inline-block;flex-shrink:0;width:18px;height:18px;vertical-align:middle;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd0d5;border-radius:9px;border:2px solid var(--surface)}
::-webkit-scrollbar-track{background:transparent}
.skip-link{position:fixed;top:-100px;left:16px;z-index:120;background:white;border-radius:8px;padding:12px}
.skip-link:focus{top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:550;line-height:1.4;border:1px solid transparent;transition:background .16s,border-color .16s,box-shadow .16s;white-space:nowrap;cursor:pointer;text-decoration:none}
.btn .ico{width:15px;height:15px}
.btn-p{background:#262c30;color:white;box-shadow:0 1px 2px #13161915}
.btn-p:hover:not(:disabled){background:#39443f;box-shadow:0 3px 7px #13161915}
.btn-s{background:white;color:#49515a;border-color:#dfe3e7;box-shadow:0 1px 2px #13161904}
.btn-s:hover:not(:disabled){background:#f7f9f8;border-color:#bfcac5}
.btn-g{background:transparent;color:#75808a}
.btn-g:hover:not(:disabled){background:#edf0f2;color:#22262b}
.btn-green{background:#edf5f1;color:#267660;border-color:#d5e7dc}
.btn-green:hover:not(:disabled){background:#e0eee6}
.btn-danger{background:#fff2f1;border-color:#f0d8d5;color:#b45146}
.btn-xs{padding:5px 8px;font-size:11px;border-radius:6px}
.icon-btn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;color:#7a838c;border-radius:8px;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:#eef1f3;color:#27332e}
.icon-btn .ico{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 3px #19212a02}
.inp{width:100%;background:white;border:1px solid #dfe3e7;border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.45;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:#a4acb4}
.inp:focus{border-color:#6f9e8d;box-shadow:0 0 0 3px #26766010}
.inp:disabled,.inp[readonly]{background:#f6f8f7;color:#65716c}
.inp[readonly].computed{font-weight:650;color:#267660;border-color:#d5e5dc;background:#f1f7f3}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:10.5px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:#818a94;margin-bottom:6px}
.field-note{font-size:11px;color:#8a929a;margin-top:5px;line-height:1.5}
.required{color:#538774;margin-left:3px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--card);max-width:100%;box-shadow:0 2px 3px #19212a02}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.tbl thead th{position:sticky;top:0;background:#f9fafb;color:#818994;font-weight:600;text-transform:uppercase;letter-spacing:.045em;font-size:10px;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;z-index:1}
table.tbl td{padding:13px 14px;border-bottom:1px solid #f0f2f4;vertical-align:middle;white-space:nowrap;color:#56606a}
table.tbl td b{font-weight:600;color:#2c333a}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:#fafcfb}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl th.c,table.tbl td.c{text-align:center}
table.tbl td.actions{white-space:nowrap}
.empty{text-align:center!important;color:#9aa2ab!important;padding:48px 20px!important;font-size:12px}
.empty .ico{width:30px;height:30px;color:#b9c4be;display:block;margin:0 auto 10px}
.cell-title{font-weight:550;color:#333d37}
.cell-sub{display:block;font-size:10.5px;color:#9aa1a8;margin-top:4px}
.record-link{text-align:left;color:#34463e;transition:color .15s;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.record-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:156px;position:relative;box-shadow:0 2px 3px #19212a02}
.stat b{display:block;font-size:18px;line-height:1.3;font-weight:600;letter-spacing:-.045em;margin-top:8px;white-space:nowrap}
.stat span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8a929c;font-weight:600;white-space:nowrap}
.stat.accent{background:#f7fbf9;border-color:#dce8e1}
.stat.accent b{color:#286d55}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:24px}
.page-head-copy{min-width:220px;flex:1}
.page-eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;color:#98a0a9;text-transform:uppercase;margin-bottom:8px}
.page-head h1{font-size:24px;letter-spacing:-.045em;line-height:1.2;font-weight:650;margin:0}
.page-sub{font-size:12px;color:#8a929b;margin-top:8px;line-height:1.6;max-width:600px}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px}
.page-stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px;max-width:65%;padding-top:1px}
.filter-bar{padding:15px;display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.filter-bar .inp{font-size:11.5px;min-height:36px}
.filter-bar .lbl{font-size:9px;margin-bottom:5px}
.filter-bar>div:not(.filter-spacer):not(.stat){flex:1 1 125px;min-width:112px;max-width:280px}
.filter-bar .filter-spacer{flex:1;min-width:0}
.filter-bar .stat{padding:8px 12px;min-width:120px}
.filter-bar .stat b{margin-top:4px;font-size:15px}
.section-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:#626d77;margin:22px 0 12px}
.count-badge{font-size:10px;font-weight:550;background:#edf0f2;color:#929aa3;padding:2px 7px;border-radius:5px;min-width:21px;text-align:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:550;letter-spacing:.01em;padding:4px 7px;border-radius:5px;background:#f4f5f7;color:#8b929c;border:1px solid #e9ecf0;line-height:1.3}
.tag.dark,.tag.success{background:#edf6f0;color:#4b8869;border-color:#dcebe0}
.tag.warn{background:#fff8e9;color:#a28647;border-color:#f2e8ce}
.tag.danger{background:#fff2f1;color:#b45146;border-color:#f0d8d5}
.tag .ico{width:12px;height:12px}
.tag-dot{width:4px;height:4px;border-radius:50%;background:currentColor}
.subtab{padding:7px 12px;font-size:11.5px;border-radius:6px;color:#7d8790;cursor:pointer;font-weight:550;transition:.15s;border:0;background:transparent}
.subtab.on{background:#fff;color:#2e4e3e;box-shadow:0 1px 4px #1a302412}
.subtab:hover:not(.on){color:#36443c}
.info-box{border:1px solid #dfeae4;border-radius:9px;padding:11px 13px;background:#f7fbf8;color:#708278;font-size:11.5px;line-height:1.7;display:flex;align-items:flex-start;gap:9px}
.info-box>.ico{margin-top:2px;color:#69927d;width:16px;height:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);z-index:45;display:flex;flex-direction:column;transition:width .22s,transform .22s}
.sidebar-brand{height:84px;display:flex;align-items:center;gap:11px;padding:0 23px;flex-shrink:0}
.brand-mark{width:35px;height:35px;background:linear-gradient(145deg,#343f37,#222a27);color:#fff;border-radius:9px;display:grid;place-items:center;font-size:18px;font-weight:700;flex-shrink:0;overflow:hidden}
.brand-copy{min-width:0}
.brand-copy strong{font-size:12px;letter-spacing:.07em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.brand-copy span{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#a3aaa5;display:block;margin-top:3px}
.sidebar-workspace{margin:0 15px 12px;padding:11px;border:1px solid #e8ece9;border-radius:9px;display:flex;align-items:center;gap:9px;background:#fbfcfb}
.workspace-mark{width:29px;height:29px;flex-shrink:0;border:1px solid #e5eae6;border-radius:7px;background:white;display:grid;place-items:center;color:#788c7e}
.workspace-mark .ico{width:15px;height:15px}
.workspace-copy{min-width:0;flex:1}
.workspace-copy b{display:block;font-size:10.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace-copy small{display:block;font-size:9.5px;color:#98a39b;margin-top:3px}
.sidebar-nav{flex:1;overflow-y:auto;padding:4px 13px 20px}
.nav-group{margin:16px 10px 7px;font-size:9px;letter-spacing:.11em;font-weight:600;color:#a8afb5;text-transform:uppercase}
.navtab{width:100%;display:flex;align-items:center;gap:11px;border:0;border-radius:7px;padding:10px 12px;margin:2px 0;font-size:11.5px;line-height:1.5;text-align:left;color:#818a92;font-weight:500;position:relative;white-space:nowrap;transition:background .14s,color .14s;background:transparent}
.navtab>.ico{width:17px;height:17px;color:#959da4;flex-shrink:0}
.navtab .nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.navtab .nav-count{font-size:9px;min-width:20px;padding:1px 5px;border-radius:4px;background:#f1f3f4;color:#9ea5ab;text-align:center}
.navtab:hover{background:#f5f7f6;color:#3c4b42}
.navtab.on{background:#edf5ef;color:#376c4d;font-weight:600}
.navtab.on>.ico{color:#518563}
.navtab.on .nav-count{background:#dfece2;color:#689172}
.navtab.on:before{content:"";position:absolute;left:-13px;top:9px;bottom:9px;width:3px;background:#659674;border-radius:0 4px 4px 0}
.sidebar-bottom{padding:13px 16px;border-top:1px solid #edf0ed;background:#fdfefd;flex-shrink:0}
.sidebar-backup{display:flex;align-items:center;gap:10px;border:0;background:transparent;width:100%;padding:8px 6px;color:#87968b;text-align:left}
.sidebar-backup>.ico{width:18px;height:18px}
.sidebar-backup b{display:block;font-size:10.5px;font-weight:550;color:#64796b}
.sidebar-backup small{display:block;font-size:9px;color:#a2ada5;margin-top:3px}
.sidebar-bottom-line{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 0;font-size:9px;color:#a7aea9}
.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#74a485;flex-shrink:0}
.workspace{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;min-width:0;transition:margin-left .22s}
.app-header{position:sticky;top:0;background:var(--topbar);z-index:35}
.topbar{height:66px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid #edf0f2}
.header-crumb{display:flex;align-items:center;gap:10px;font-size:11px;min-width:0}
.header-crumb .ico{width:14px;height:14px;color:#bec5ca}
.header-crumb span{color:#a3aab1;white-space:nowrap}
.header-crumb b{font-weight:500;white-space:nowrap;color:#65726a;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.topbar-right{display:flex;align-items:center;gap:15px;margin-left:auto}
.topbar-date{font-size:10px;color:#959da5;display:flex;align-items:center;gap:7px;white-space:nowrap}
.header-divider{width:1px;height:23px;background:#edf0f1}
.profile-wrap{position:relative}
.profile-button{display:flex;align-items:center;gap:9px;padding:4px;border:0;background:transparent;text-align:left;border-radius:8px}
.profile-button:hover{background:#f7f9f8}
.avatar{width:31px;height:31px;border-radius:50%;background:#eef2e8;color:#82916e;display:grid;place-items:center;font-size:11px;font-weight:600;border:1px solid #e3e9da}
.profile-copy{max-width:130px}
.profile-copy b{font-size:10.5px;font-weight:550;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:#566159}
.profile-copy small{font-size:9px;color:#a6ada8;display:block;margin-top:2px}
.profile-menu{position:absolute;right:0;top:calc(100% + 12px);width:270px;padding:14px;z-index:55;box-shadow:0 10px 40px #1e362012}
.tab-strip{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:9px 28px;background:#fbfcfc;border-bottom:1px solid var(--line);min-height:44px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:9px;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 7px 5px 10px;font-size:10px;color:#9ba4ab;white-space:nowrap}
.chip.on{background:#fff;color:#567260;border-color:#e2e8e4;box-shadow:0 1px 2px #18352705}
.chip>button:first-child{display:flex;align-items:center;gap:6px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.chip .ico{width:12px;height:12px}
.chip-close{width:15px;height:15px;display:grid;place-items:center;border-radius:3px;color:#b3bcb5;border:0;background:transparent;cursor:pointer}
.chip-close:hover{color:#46594d;background:#eff4f0}
.tab-empty{font-size:10px;color:#a9b0b5}
.main-view{flex:1;width:100%;min-width:0;padding:28px}
.app-footer{border-top:1px solid #e8ebee;padding:13px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;color:#a1a9b0;font-size:9px;background:#fbfcfd}
.app-footer>span:last-child{margin-left:auto}
.mobile-menu{display:none}
.sidebar-overlay{display:none;position:fixed;inset:0;background:#15251e66;backdrop-filter:blur(2px);z-index:44}
body.sidebar-collapsed{--sidebar:76px}
body.sidebar-collapsed .sidebar-brand{padding:0;justify-content:center}
body.sidebar-collapsed .brand-copy,body.sidebar-collapsed .sidebar-workspace,body.sidebar-collapsed .nav-group,body.sidebar-collapsed .nav-label,body.sidebar-collapsed .nav-count,body.sidebar-collapsed .sidebar-backup>div,body.sidebar-collapsed .sidebar-bottom-line>span{display:none}
body.sidebar-collapsed .sidebar-nav{padding:7px 12px}
body.sidebar-collapsed .navtab{justify-content:center;padding:12px}
body.sidebar-collapsed .sidebar-bottom{padding:10px}
body.sidebar-collapsed .sidebar-backup{justify-content:center}
body.sidebar-collapsed .sidebar-bottom-line{justify-content:center}
body.sidebar-collapsed .navtab.on:before{left:-12px}
.empty-workspace{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.empty-workspace>.ico{width:38px;height:38px;color:#9eb5a5;margin-bottom:18px}
.empty-workspace h1{font-size:20px;font-weight:600;letter-spacing:-.04em}
.empty-workspace p{font-size:12px;color:#96a198;margin:10px 0 24px}
.modal-bd{position:fixed;inset:0;background:#18251f65;backdrop-filter:blur(3px);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;animation:fade .15s ease}
.modal{background:white;border:1px solid #fff;border-radius:15px;width:100%;box-shadow:0 24px 90px -25px #13201970;animation:pop .18s ease;margin:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:19px 23px;border-bottom:1px solid var(--line);gap:10px}
.modal-header h3{font-size:15px;font-weight:600;letter-spacing:-.025em;margin:0}
.modal-body{padding:23px}
.modal-footer{padding:15px 23px;border-top:1px solid var(--line);background:#fafcfb;border-radius:0 0 15px 15px;display:flex;justify-content:flex-end;gap:8px}
.modal-footer-note{margin-right:auto;align-self:center;font-size:10px;color:#97a69b}
#toast{position:fixed;right:22px;bottom:22px;z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:9px;max-width:calc(100vw - 32px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:#273930;color:white;font-size:12px;line-height:1.6;padding:13px 17px;border:1px solid #41594b;border-radius:10px;box-shadow:0 10px 35px #1a2d2730;animation:pop .2s;max-width:480px;pointer-events:auto}
.toast.error{background:#483930;border-color:#6c5244}
.toast .ico{width:17px;height:17px;color:#b7d3be}
.toast.error .ico{color:#e1c1a6}
.sk{animation:spin .8s linear infinite;display:inline-block}
.auth-screen{min-height:100vh;display:flex}
.auth-brand-side{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;width:49%;background:#25312b;color:#f3f6f3;padding:46px 56px;min-height:100vh}
.auth-brand-side:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 100% 10%,#56755d40,transparent 60%),radial-gradient(ellipse at 0 100%,#101b1380,transparent 70%)}
.auth-brand-side:after{content:"";position:absolute;width:650px;height:650px;left:20%;top:30%;border:1px solid #e8f2e610;border-radius:50%;box-shadow:0 0 0 70px #e8f2e605,0 0 0 140px #e8f2e604;z-index:-1}
.auth-brand{display:flex;align-items:center;gap:11px}
.auth-brand .brand-mark{background:#e8eee5;color:#35482f}
.auth-brand b{font-size:12px;letter-spacing:.12em;font-weight:600}
.auth-brand small{display:block;font-size:9px;color:#84978a;letter-spacing:.16em;margin-top:4px}
.auth-hero{padding:65px 0}
.auth-kicker{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#b2c2b3;margin-bottom:25px}
.auth-kicker .status-dot{background:#b3cfa0;box-shadow:0 0 0 4px #b3cfa010}
.auth-hero h1{font-size:clamp(32px,3.3vw,47px);line-height:1.2;font-weight:500;letter-spacing:-.05em;max-width:510px}
.auth-hero h1 span{color:#b3c7ab}
.auth-hero p{max-width:420px;color:#97aa9b;font-size:13px;line-height:1.9;margin-top:23px}
.auth-flow{display:flex;align-items:center;gap:9px;margin-top:38px}
.flow-card{padding:15px 17px;background:#ffffff04;border:1px solid #ffffff12;border-radius:9px;flex:1;max-width:133px}
.flow-card .ico{color:#a3bea6;width:20px;height:20px;margin-bottom:15px}
.flow-card b{display:block;font-size:10px;font-weight:500;color:#b7c5b9;white-space:nowrap}

<script>
const DB_KEY = "micir_erp_v2";
const SESSION_KEY = "micir_erp_session";
const ICO = (d) => `<svg class="ico" viewBox="0 0 24 24">${d}</svg>`;
const ICONS = {

  x: ICO('<path d="M18 6L6 18M6 6l12 12"/>'),
  chev: ICO('<path d="M9 18l6-6-6-6"/>'),

  info: ICO('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>'),

const PAGES = {
  dashboard: {label:"Dashboard", group:"Operasyon", icon:"layout"},
  kantar: {label:"Kantar Fişleri", group:"Operasyon", icon:"scale"},
  malzemeler: {label:"Malzemeler", group:"Operasyon", icon:"box"},
  tesis: {label:"Tesis Çalışma", group:"Operasyon", icon:"clock"},
  cariler: {label:"Cariler", group:"Ticari", icon:"users"},
  finans: {label:"Finans", group:"Ticari", icon:"wallet"},
  cekler: {label:"Çekler", group:"Ticari", icon:"check"},
  ayarlar: {label:"Ayarlar", group:"Sistem", icon:"settings"},
  asistan: {label:"Asistan", group:"Sistem", icon:"spark"}
};

let db, page = "dashboard", tabs = ["dashboard"], filters = {}, profileOpen = false;

function uid(p="id"){return p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function today(){return new Date().toISOString().slice(0,10)}
function nowTime(){return new Date().toTimeString().slice(0,5)}
function money(n){n=Number(n)||0;return n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺"}
function ton(n){n=Number(n)||0;return n.toLocaleString("tr-TR",{minimumFractionDigits:3,maximumFractionDigits:3})+" t"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function cariById(id){return (db.cariler||[]).find(c=>c.id===id)}
function malById(id){return (db.malzemeler||[]).find(m=>m.id===id)}
function cariName(id){const c=cariById(id);return c?c.unvan:"—"}
function nextFisNo(){
  const nums=(db.fisler||[]).map(f=>parseInt(String(f.no).replace(/\D/g,""),10)||0);
  const n=Math.max(1000,...nums)+1;
  return "KF-"+n;
}

function defaultDb(){
  const m1=uid("m"),m2=uid("m"),m3=uid("m"),m4=uid("m");
  return {
    version:2,
    users:[],
    settings:{
      company:"Mıcır Ocağı",
      workspace:"Merkez Tesis",
      email:"",
      password:"",
      userName:"",
      theme:"default",
      phone:"",
      address:"",
      about:"Mıcır ocağı kantar, cari, finans ve operasyon yönetimi."
    },
    malzemeler:[
      {id:m1,ad:"1 No Mıcır (5-12 mm)",birim:"ton",fiyat:420},
      {id:m2,ad:"2 No Mıcır (12-22 mm)",birim:"ton",fiyat:390},
      {id:m3,ad:"3 No Mıcır (22-32 mm)",birim:"ton",fiyat:370},
      {id:m4,ad:"Taş Tozu",birim:"ton",fiyat:280}
    ],
    cariler:[],
    fisler:[],
    finans:[],
    cekler:[],
    tesis:[]
  };
}

function loadDb(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw){db=defaultDb();saveDb();return}
    db=JSON.parse(raw);
    if(!db.settings) db.settings=defaultDb().settings;
    if(!Array.isArray(db.users)) db.users=[];
    if(db.settings.email==="admin@micir.local" || db.settings.password==="Admin123!"){
      db.settings.email=""; db.settings.password=""; db.settings.userName="";
    }
    db.users=db.users.filter(u=>u && u.email && u.email!=="admin@micir.local" && u.password!=="Admin123!");
    ["malzemeler","cariler","fisler","finans","cekler","tesis"].forEach(k=>{if(!Array.isArray(db[k])) db[k]=[]});
    db.fisler.forEach(f=>{
      if(f.net==null && f.brut!=null) f.net=Number(f.brut||0)-Number(f.dara||0);
      if(f.tutar==null) f.tutar=Number(f.net||0)*Number(f.birimFiyat||0);
    });
  }catch(e){db=defaultDb()}
}
function saveDb(){localStorage.setItem(DB_KEY,JSON.stringify(db))}

let authMode="register";
function currentEmail(){return sessionStorage.getItem(SESSION_KEY)||""}
function loggedIn(){
  const s=currentEmail();
  if(!s || s==="1") return false;
  return !!findUser(s);
}
function findUser(email){
  email=String(email||"").trim().toLowerCase();
  return (db.users||[]).find(u=>String(u.email).toLowerCase()===email)
    || (db.settings.email && String(db.settings.email).toLowerCase()===email ? {email:db.settings.email,password:db.settings.password,name:db.settings.userName} : null);
}
function setSession(email){
  sessionStorage.setItem(SESSION_KEY,email.trim().toLowerCase());
}
function login(email,pass){
  const u=findUser(email);
  if(u && u.password && pass===u.password){setSession(u.email);return true}
  return false;
}
function registerUser(name,email,pass){
  email=String(email||"").trim().toLowerCase();
  name=String(name||"").trim();
  if(!name||!email||!pass) return "Ad, e-posta ve şifre zorunlu.";
  if(pass.length<6) return "Şifre en az 6 karakter olmalı.";
  if(findUser(email)) return "Bu e-posta ile hesap var. Giriş yapın.";
  db.users.push({id:uid("u"),name,email,password:pass});
  if(!db.settings.email){
    db.settings.email=email;
    db.settings.password=pass;
    db.settings.userName=name;
  }
  saveDb();
  setSession(email);
  return "";
}
function activeUser(){
  const em=currentEmail();
  return findUser(em) || {email:db.settings.email,name:db.settings.userName,password:db.settings.password};
}
function logout(){sessionStorage.removeItem(SESSION_KEY);authMode=db.users.length?"login":"register";render()}

function toast(msg,err){
  const el=document.createElement("div");
  el.className="toast"+(err?" error":"");
  el.innerHTML=`${err?ICONS.info:ICONS.check2}<span>${esc(msg)}</span>`;
  document.getElementById("toast").appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

function applyTheme(){
  document.body.classList.remove("theme-dark","theme-stone");
  if(db.settings.theme==="dark") document.body.classList.add("theme-dark");
  if(db.settings.theme==="stone") document.body.classList.add("theme-stone");
}

function fisTutar(f){return Number(f.net||0)*Number(f.birimFiyat||0)}
function cariBakiye(id){
  const c=cariById(id); if(!c) return 0;
  const satis=(db.fisler||[]).filter(f=>f.cariId===id).reduce((s,f)=>s+fisTutar(f),0);
  const fin=(db.finans||[]).filter(x=>x.cariId===id).reduce((s,x)=>{
    if(x.tip==="tahsilat") return s-Number(x.tutar||0);
    if(x.tip==="odeme") return s+Number(x.tutar||0);
    return s+Number(x.tutar||0);
  },0);
  const cekTahsil=(db.cekler||[]).filter(x=>x.cariId===id && x.durum==="Tahsil").reduce((s,x)=>s-Number(x.tutar||0),0);
  return Number(c.acilis||0)+satis+fin+cekTahsil;
}

function openModal(html,width="640px"){
  document.getElementById("modalRoot").innerHTML=`<div class="modal-bd" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:${width}">${html}</div></div>`;
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}

function navTo(p,keepTab){
  page=p;
  if(!tabs.includes(p)) tabs.push(p);
  profileOpen=false;
  document.body.classList.remove("sidebar-open");
  renderApp();
}
function closeTab(p,ev){
  ev.stopPropagation();
  tabs=tabs.filter(t=>t!==p);
  if(!tabs.length) tabs=["dashboard"];
  if(page===p) page=tabs[tabs.length-1];
  renderApp();
}

function exportSheet(rows,name,file){
  if(!window.XLSX){toast("Excel kütüphanesi yüklenemedi",true);return}
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
  XLSX.writeFile(wb,file);
}

function exportCariDetay(cariId){
  const c=cariById(cariId); if(!c) return;
  const satis=db.fisler.filter(f=>f.cariId===cariId).map(f=>({
    "Fiş No":f.no,Tarih:f.tarih,Saat:f.saat,Plaka:f.plaka,Malzeme:malById(f.malzemeId)?.ad||"",
    "Tonaj":Number(f.net||0),"Birim Fiyat":Number(f.birimFiyat||0),Tutar:fisTutar(f)
  }));
  const fin=db.finans.filter(x=>x.cariId===cariId).map(x=>({Tarih:x.tarih,Tip:x.tip,Tutar:x.tutar,Yöntem:x.yontem,Açıklama:x.aciklama}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{
    Kod:c.kod,Unvan:c.unvan,Tip:c.tip,Yetkili:c.yetkili,Telefon:c.telefon,Vergi:c.vergiNo,Adres:c.adres,Bakiye:cariBakiye(c.id)
  }]),"Cari");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(satis.length?satis:[{"Fiş No":"—"}]),"Satislar");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fin.length?fin:[{Tarih:"—"}]),"Finans");
  XLSX.writeFile(wb, (c.kod||"cari")+"_detay.xlsx");
  toast("Cari detayı Excel'e aktarıldı");
}

function exportAllCariler(){
  const ozet=db.cariler.map(c=>({
    Kod:c.kod,Unvan:c.unvan,Tip:c.tip,Yetkili:c.yetkili,Telefon:c.telefon,
    "Vergi Dairesi":c.vergiDairesi,"Vergi No":c.vergiNo,Adres:c.adres,Bakiye:cariBakiye(c.id),
    "Satış Adedi":db.fisler.filter(f=>f.cariId===c.id).length,
    "Satış Tutarı":db.fisler.filter(f=>f.cariId===c.id).reduce((s,f)=>s+fisTutar(f),0)
  }));
  const satislar=db.fisler.map(f=>({
    Cari:cariName(f.cariId),Kod:cariById(f.cariId)?.kod||"","Fiş No":f.no,Tarih:f.tarih,Plaka:f.plaka,
    Malzeme:malById(f.malzemeId)?.ad||"",Tonaj:Number(f.net||0),"Birim Fiyat":Number(f.birimFiyat||0),Tutar:fisTutar(f)
  }));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ozet),"Cariler");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(satislar.length?satislar:[{Cari:"—"}]),"Tum Satislar");
  XLSX.writeFile(wb,"cariler_toplu.xlsx");
  toast("Tüm cariler ve satış detayları aktarıldı");
}

function ticketHTML(f){
  const c=cariById(f.cariId), m=malById(f.malzemeId);
  return `<div class="ticket">
    <div class="ticket-head">
      <h2>${esc(db.settings.company||"MICIR OCAGI")}</h2>
      <small>KANTAR FİŞİ · ${esc(db.settings.workspace||"Merkez Tesis")}</small>
    </div>
    <div class="ticket-row"><span>Fiş No</span><b>${esc(f.no)}</b></div>
    <div class="ticket-row"><span>Tarih / Saat</span><b>${esc(f.tarih)} ${esc(f.saat||"")}</b></div>
    <div class="ticket-row"><span>Plaka</span><b>${esc(f.plaka||"—")}</b></div>
    <div class="ticket-row"><span>Şoför</span><b>${esc(f.sofor||"—")}</b></div>
    <div class="ticket-row"><span>Cari</span><b>${esc(c?c.unvan:"—")}</b></div>
    <div class="ticket-row"><span>Malzeme</span><b>${esc(m?m.ad:"—")}</b></div>
    <hr class="ticket-sep">
    <div class="ticket-row"><span>1. Tartım (Brüt)</span><b>${ton(f.brut)}</b></div>
    <div class="ticket-row"><span>2. Tartım (Dara)</span><b>${ton(f.dara)}</b></div>
    <div class="ticket-row"><span>Net Tonaj</span><b>${ton(f.net)}</b></div>
    <hr class="ticket-sep">
    <div class="ticket-row"><span>Birim Fiyat</span><b>${money(f.birimFiyat)}</b></div>
    <div class="ticket-row"><span>Tonaj</span><b>${ton(f.net)}</b></div>
    <div class="ticket-total"><span>TUTAR</span><span>${money(fisTutar(f))}</span></div>
    <hr class="ticket-sep">
    <div class="ticket-row"><span>Operatör</span><b>${esc(f.operator||"—")}</b></div>
    <div class="ticket-foot">Bu belge elektronik kantar kaydıdır.<br>${esc(f.not||"")}</div>
  </div>`;
}
function previewFis(id){
  const f=db.fisler.find(x=>x.id===id); if(!f) return;
  openModal(`<div class="modal-header"><h3>Kantar Fişi Önizleme</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">${ticketHTML(f)}</div>
    <div class="modal-footer"><span class="modal-footer-note">${esc(f.no)}</span>
      <button class="btn btn-s" onclick="closeModal()">Kapat</button>
      <button class="btn btn-p" onclick="printFis('${f.id}')">${ICONS.print} Yazdır</button>
    </div>`, "480px");
}
function printFis(id){
  const f=db.fisler.find(x=>x.id===id); if(!f) return;
  const root=document.getElementById("print-root");
  root.classList.remove("hidden");
  root.innerHTML=ticketHTML(f);
  window.print();
  root.classList.add("hidden");
}

function backupDownload(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="micir_erp_yedek_"+today()+".json";
  a.click();
  toast("Yedek indirildi");
}
function restoreBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||!data.settings) throw new Error("Geçersiz yedek");
      db=data; saveDb(); renderApp(); toast("Yedek geri yüklendi");
    }catch(e){toast("Yedek okunamadı",true)}
  };
  r.readAsText(file);
}

function doLogin(form){
  const fd=new FormData(form);
  if(login(fd.get("email"),fd.get("password"))){toast("Hoş geldiniz");render()}
  else toast("E-posta veya şifre hatalı",true);
}
function doRegister(form){
  const fd=new FormData(form);
  if(fd.get("password")!==fd.get("password2")){toast("Şifreler eşleşmiyor",true);return}
  const err=registerUser(fd.get("name"),fd.get("email"),fd.get("password"));
  if(err){toast(err,true);return}
  toast("Hesap oluşturuldu");
  render();
}

function renderPage(){
  switch(page){
    case "dashboard": return viewDashboard();
    case "kantar": return viewKantar();
    case "malzemeler": return viewMalzemeler();
    case "tesis": return viewTesis();
    case "cariler": return viewCariler();
    case "finans": return viewFinans();
    case "cekler": return viewCekler();
    case "ayarlar": return viewAyarlar();
    case "asistan": return viewAsistan();
    default: return "";
  }
}

function viewDashboard(){
  const tTon=db.fisler.reduce((s,f)=>s+Number(f.net||0),0);
  const tSat=db.fisler.reduce((s,f)=>s+fisTutar(f),0);
  const alacak=db.cariler.reduce((s,c)=>s+Math.max(0,cariBakiye(c.id)),0);
  const idle=db.tesis.reduce((s,t)=>{
    const p=String(t.calisilmayanSure||"0").split(":");
    return s+(Number(p[0]||0)+Number(p[1]||0)/60);
  },0);
  const recent=[...db.fisler].sort((a,b)=>(b.tarih+b.saat).localeCompare(a.tarih+a.saat)).slice(0,8);
  const due=db.cekler.filter(c=>c.durum==="Portföy").slice(0,6);
  return `
  <div class="page-head">
    <div class="page-head-copy">
      <div class="page-eyebrow">Özet</div>
      <h1>Dashboard</h1>
      <p class="page-sub">Tesis hareketleri, kantar tonajı, cari alacak ve çek portföyü tek bakışta.</p>
    </div>
  </div>
  <div class="dash-kpi">
    <div class="stat"><span>Kantar fişi</span><b>${db.fisler.length}</b></div>
    <div class="stat"><span>Toplam tonaj</span><b>${ton(tTon)}</b></div>
    <div class="stat"><span>Satış tutarı</span><b>${money(tSat)}</b></div>
    <div class="stat accent"><span>Cari alacak</span><b>${money(alacak)}</b></div>
  </div>
  <div class="dash-grid">
    <div>
      <div class="section-label">Son kantar fişleri <span class="count-badge">${recent.length}</span></div>
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>Fiş</th><th>Cari</th><th>Malzeme</th><th class="r">Tonaj</th><th class="r">Tutar</th></tr></thead>
        <tbody>${recent.length?recent.map(f=>`<tr>
          <td><button class="record-link" onclick="previewFis('${f.id}')">${esc(f.no)}</button><span class="cell-sub">${esc(f.tarih)} ${esc(f.saat||"")}</span></td>
          <td>${esc(cariName(f.cariId))}</td>
          <td>${esc(malById(f.malzemeId)?.ad||"—")}</td>
          <td class="r">${ton(f.net)}</td>
          <td class="r"><b>${money(fisTutar(f))}</b></td>
        </tr>`).join(""):`<tr><td class="empty" colspan="5">Kayıt yok</td></tr>`}</tbody>
      </table></div>
    </div>
    <div>
      <div class="section-label">Portföy çekleri</div>
      <div class="card" style="padding:14px">
        ${due.length?due.map(c=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)">
          <div><b style="font-size:12px">${esc(c.no)}</b><span class="cell-sub">${esc(c.banka)} · vade ${esc(c.vade)}</span></div>
          <b>${money(c.tutar)}</b>
        </div>`).join(""):`<div class="field-note">Açık çek yok</div>`}

      </div>

}

function viewKantar(){
  const q=(filters.kantar||"").toLowerCase();
  const rows=db.fisler.filter(f=>{
    const blob=[f.no,f.plaka,f.sofor,cariName(f.cariId),malById(f.malzemeId)?.ad].join(" ").toLowerCase();
    return !q||blob.includes(q);
  }).sort((a,b)=>(b.tarih+b.saat).localeCompare(a.tarih+a.saat));
  const sumT=rows.reduce((s,f)=>s+Number(f.net||0),0);
  const sumM=rows.reduce((s,f)=>s+fisTutar(f),0);
  return `
  <div class="page-head">
    <div class="page-head-copy">
      <div class="page-eyebrow">Operasyon</div>
      <h1>Kantar fişleri</h1>
      <p class="page-sub">Brüt / dara ayrı, net tonaj ve birim fiyat ayrı satır. Kayıttan sonra gerçek fiş önizlemesi.</p>
      <div class="page-actions">
        <button class="btn btn-p" onclick="openFisForm()">${ICONS.plus} Yeni fiş</button>
        <button class="btn btn-s" onclick="exportKantar()">${ICONS.download} Excel</button>
      </div>
    </div>
    <div class="page-stats">
      <div class="stat"><span>Fiş</span><b>${rows.length}</b></div>
      <div class="stat"><span>Tonaj</span><b>${ton(sumT)}</b></div>
      <div class="stat accent"><span>Tutar</span><b>${money(sumM)}</b></div>
    </div>
  </div>
  <div class="card filter-bar">
    <div style="max-width:280px;flex:1"><label class="lbl">Ara</label><input class="inp" placeholder="Fiş, plaka, cari…" value="${esc(filters.kantar||"")}" oninput="filters.kantar=this.value;renderApp()"></div>
    <div class="filter-spacer"></div>
  </div>
  <div class="tblwrap"><table class="tbl">
    <thead><tr><th>Fiş</th><th>Cari / Plaka</th><th>Malzeme</th><th class="r">Tonaj</th><th class="r">Birim fiyat</th><th class="r">Tutar</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(f=>`<tr>
      <td><button class="record-link" onclick="previewFis('${f.id}')">${esc(f.no)}</button><span class="cell-sub">${esc(f.tarih)} ${esc(f.saat||"")}</span></td>
      <td><span class="cell-title">${esc(cariName(f.cariId))}</span><span class="cell-sub">${esc(f.plaka||"—")} · ${esc(f.sofor||"")}</span></td>
      <td>${esc(malById(f.malzemeId)?.ad||"—")}</td>
      <td class="r">${ton(f.net)}</td>
      <td class="r">${money(f.birimFiyat)}</td>
      <td class="r"><b>${money(fisTutar(f))}</b></td>
      <td class="actions">
        <button class="icon-btn" title="Önizle" onclick="previewFis('${f.id}')">${ICONS.file}</button>
        <button class="icon-btn" title="Düzenle" onclick="openFisForm('${f.id}')">${ICONS.save}</button>
        <button class="icon-btn" title="Sil" onclick="delFis('${f.id}')">${ICONS.trash}</button>
      </td>
    </tr>`).join(""):`<tr><td class="empty" colspan="7">${ICONS.scale} Fiş yok</td></tr>`}</tbody>
  </table></div>`;
}
function exportKantar(){
  exportSheet(db.fisler.map(f=>({
    "Fiş No":f.no,Tarih:f.tarih,Saat:f.saat,Plaka:f.plaka,Sofor:f.sofor,Cari:cariName(f.cariId),
    Malzeme:malById(f.malzemeId)?.ad||"",Brut:f.brut,Dara:f.dara,Tonaj:f.net,"Birim Fiyat":f.birimFiyat,Tutar:fisTutar(f)
  })),"Kantar","kantar_fisleri.xlsx");
  toast("Kantar listesi aktarıldı");
}
function openFisForm(id){
  const f=id?db.fisler.find(x=>x.id===id):{tarih:today(),saat:nowTime(),no:nextFisNo(),brut:"",dara:"",birimFiyat:"",operator:activeUser().name||db.settings.userName};
  const cariOpts=db.cariler.map(c=>`<option value="${c.id}" ${c.id===f.cariId?"selected":""}>${esc(c.unvan)}</option>`).join("");
  const malOpts=db.malzemeler.map(m=>`<option value="${m.id}" ${m.id===f.malzemeId?"selected":""} data-fiyat="${m.fiyat}">${esc(m.ad)}</option>`).join("");
  openModal(`<div class="modal-header"><h3>${id?"Fişi düzenle":"Yeni kantar fişi"}</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
    <form class="modal-body" onsubmit="event.preventDefault();saveFis(this,'${id||""}')">
      <div class="form-grid">
        <div><label class="lbl">Fiş no</label><input class="inp" name="no" value="${esc(f.no||"")}" required></div>
        <div><label class="lbl">Tarih</label><input class="inp" type="date" name="tarih" value="${esc(f.tarih||today())}" required></div>
        <div><label class="lbl">Saat</label><input class="inp" type="time" name="saat" value="${esc(f.saat||nowTime())}"></div>
        <div><label class="lbl">Plaka</label><input class="inp" name="plaka" value="${esc(f.plaka||"")}" required></div>
        <div><label class="lbl">Şoför</label><input class="inp" name="sofor" value="${esc(f.sofor||"")}"></div>
        <div><label class="lbl">Cari <span class="required">*</span></label><select class="inp" name="cariId" required><option value="">Seçin</option>${cariOpts}</select></div>
        <div class="full"><label class="lbl">Malzeme</label>
          <select class="inp" name="malzemeId" onchange="const o=this.selectedOptions[0]; if(o&&o.dataset.fiyat) this.form.birimFiyat.value=o.dataset.fiyat">
            <option value="">Seçin</option>${malOpts}
          </select>
        </div>
        <div><label class="lbl">1. Tartım — Brüt (ton)</label><input class="inp" name="brut" type="number" step="0.001" value="${esc(f.brut??"")}" required oninput="calcNet(this.form)"></div>
        <div><label class="lbl">2. Tartım — Dara (ton)</label><input class="inp" name="dara" type="number" step="0.001" value="${esc(f.dara??"")}" required oninput="calcNet(this.form)"></div>
        <div class="full"><label class="lbl">Net tonaj</label><input class="inp computed" name="net" readonly value="${esc(f.net??"")}"></div>
        <div class="full"><label class="lbl">Birim fiyat (₺ / ton)</label><input class="inp" name="birimFiyat" type="number" step="0.01" value="${esc(f.birimFiyat??"")}" required oninput="calcNet(this.form)"></div>
        <div class="full"><label class="lbl">Tutar</label><input class="inp computed" name="tutarGoster" readonly></div>
        <div><label class="lbl">Operatör</label><input class="inp" name="operator" value="${esc(f.operator||"")}"></div>
        <div class="full"><label class="lbl">Not</label><textarea class="inp" name="not" rows="2">${esc(f.not||"")}</textarea></div>
      </div>
      <p class="field-note">Tonaj ve birim fiyat ayrı satırdadır. Kayıttan sonra kantar fişi önizlemesi açılır.</p>
      <div class="modal-footer" style="margin:18px -23px -23px;border-radius:0 0 15px 15px">
        <button type="button" class="btn btn-s" onclick="closeModal()">Vazgeç</button>
        <button class="btn btn-p">${ICONS.save} Kaydet</button>
      </div>
    </form>`,"720px");
  const form=document.querySelector("#modalRoot form");
  if(form) calcNet(form);
}
function calcNet(form){
  const net=Math.max(0,(Number(form.brut.value)||0)-(Number(form.dara.value)||0));
  form.net.value=net.toFixed(3);
  form.tutarGoster.value=money(net*(Number(form.birimFiyat.value)||0));
}
function saveFis(form,id){
  const fd=new FormData(form);
  const brut=Number(fd.get("brut")||0), dara=Number(fd.get("dara")||0), net=Math.max(0,brut-dara);
  const rec={
    id:id||uid("f"),
    no:fd.get("no"),tarih:fd.get("tarih"),saat:fd.get("saat"),
    plaka:fd.get("plaka"),sofor:fd.get("sofor"),
    cariId:fd.get("cariId"),malzemeId:fd.get("malzemeId"),
    brut,dara,net,birimFiyat:Number(fd.get("birimFiyat")||0),
    operator:fd.get("operator"),not:fd.get("not")
  };
  if(id) db.fisler=db.fisler.map(x=>x.id===id?rec:x); else db.fisler.push(rec);
  saveDb(); closeModal(); renderApp(); toast("Kantar fişi kaydedildi"); previewFis(rec.id);
}
function delFis(id){
  if(!confirm("Fiş silinsin mi?")) return;
  db.fisler=db.fisler.filter(x=>x.id!==id); saveDb(); renderApp(); toast("Fiş silindi");
}

function saveTesis(form,id){
  const fd=new FormData(form);
  let sure=String(fd.get("calisilmayanSure")||"").trim();
  if(/^\d+([.,]\d+)?$/.test(sure)){
    const h=Number(sure.replace(",",".")); const hh=Math.floor(h); const mm=Math.round((h-hh)*60);
    sure=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
  }
  const rec={id:id||uid("t"),tarih:fd.get("tarih"),vardiya:fd.get("vardiya"),calisilmayanSure:sure,neden:fd.get("neden"),aciklama:fd.get("aciklama")};
  if(id) db.tesis=db.tesis.map(x=>x.id===id?rec:x); else db.tesis.push(rec);
  saveDb(); closeModal(); renderApp(); toast("Tesis kaydı alındı");
}

    <div class="page-eyebrow">Sistem</div><h1>Ayarlar</h1>
    <p class="page-sub">Giriş bilgisi, görünüm, kılavuz ve uygulama bilgisi.</p>
  </div></div>
  <div style="display:flex;gap:6px;margin-bottom:18px;background:#eef1f2;padding:4px;border-radius:8px;width:fit-content">
    ${tabs.map(([k,l])=>`<button class="subtab ${tab===k?"on":""}" onclick="filters.ayar='${k}';renderApp()">${l}</button>`).join("")}
  </div>
  ${tab==="hesap"?`
    <div class="card" style="padding:22px;max-width:560px">
      <form onsubmit="event.preventDefault();saveSettings(this)">
        <div class="form-grid">
          <div class="full"><label class="lbl">İşletme</label><input class="inp" name="company" value="${esc(s.company)}"></div>
          <div class="full"><label class="lbl">Tesis / çalışma alanı</label><input class="inp" name="workspace" value="${esc(s.workspace)}"></div>
          <div class="full"><label class="lbl">Kullanıcı adı</label><input class="inp" name="userName" value="${esc(u.name||s.userName||"")}"></div>
          <div class="full"><label class="lbl">E-posta</label><input class="inp" type="email" name="email" value="${esc(u.email||s.email||"")}" required></div>
          <div class="full"><label class="lbl">Mevcut şifre</label><input class="inp" type="password" name="oldPass" placeholder="Şifre değiştirecekseniz doldurun"></div>
          <div><label class="lbl">Yeni şifre</label><input class="inp" type="password" name="newPass"></div>
          <div><label class="lbl">Yeni şifre (tekrar)</label><input class="inp" type="password" name="newPass2"></div>
        </div>
        <div class="page-actions"><button class="btn btn-p">Kaydet</button></div>
      </form>
    </div>`:""}
  ${tab==="tema"?`
    <div class="theme-grid" style="max-width:640px">
      <button class="theme-opt ${s.theme==="default"?"on":""}" onclick="setTheme('default')"><div class="theme-swatch" style="background:linear-gradient(90deg,#f7f8fa,#267660)"></div><b>Kurumsal açık</b><div class="field-note">Varsayılan yeşil / mürekkep</div></button>
      <button class="theme-opt ${s.theme==="dark"?"on":""}" onclick="setTheme('dark')"><div class="theme-swatch" style="background:linear-gradient(90deg,#161a1d,#6fb394)"></div><b>Koyu</b><div class="field-note">Gece vardiyası</div></button>
      <button class="theme-opt ${s.theme==="stone"?"on":""}" onclick="setTheme('stone')"><div class="theme-swatch" style="background:linear-gradient(90deg,#f3efe8,#8a6a3b)"></div><b>Taş</b><div class="field-note">Ocak tonları</div></button>
    </div>`:""}
  ${tab==="kilavuz"?`
    <div class="card guide" style="padding:22px;max-width:760px">
      <h3>1. Giriş</h3><p>Demo hesap yoktur. İlk açılışta hesap oluşturun. E-posta ve şifre Ayarlar › Hesap bölümünden güncellenir. Oturum tarayıcı kapanınca düşer.</p>
      <h3>2. Dashboard</h3><p>Tonaj, satış tutarı, cari alacak, son fişler ve portföy çekleri.</p>
      <h3>3. Kantar fişleri</h3>
      <ul><li>Brüt ve dara ayrı alanlardır; net otomatik hesaplanır.</li><li>Birim fiyat ve tonaj formda ayrı satırdadır.</li><li>Kaydettikten sonra kantar fişi önizlemesi açılır; yazdırılabilir.</li></ul>
      <h3>4. Cariler</h3>
      <ul><li>Unvana tıklayınca satış listesi ve bakiye görülür.</li><li>“Bu cariyi Excel’e al” satış + finans sayfalarını üretir.</li><li>Toplu Excel: Cariler özeti + tüm satışlar.</li></ul>
      <h3>5. Tesis çalışma</h3><p>Süre alanı Çalışılmayan süre’dir. 01:30 veya 1.5 yazılabilir.</p>
      <h3>6. Çekler</h3><p>Portföy / tahsil / ciro / iade. Tahsil edilen çek cari bakiyeden düşer.</p>
      <h3>7. Asistan</h3><p>Uygulama modüllerini ve güncel kayıt özetini bilir. Soruyu doğal dilde yazın.</p>
      <h3>8. Yedek</h3><p>Sol alttan JSON yedek alın. Ayarlar › Hakkında üzerinden geri yükleyin.</p>
    </div>`:""}
  ${tab==="hakkinda"?`
    <div class="card" style="padding:22px;max-width:640px">
      <h3 style="margin-top:0">Mıcır Ocağı ERP</h3>
      <p class="page-sub">Sürüm 2.1 — kantar, cari, finans, çek, tesis ve asistan. Veriler tarayıcı localStorage alanında tutulur.</p>
      <p class="field-note">${esc(s.about||"")}</p>
      <div class="page-actions">
        <button class="btn btn-s" onclick="backupDownload()">${ICONS.download} Yedek indir</button>
        <label class="btn btn-s">${ICONS.file} Yedek yükle<input type="file" accept="application/json" hidden onchange="restoreBackup(this.files[0])"></label>
      </div>
    </div>`:""}`;
}
function saveSettings(form){
  const fd=new FormData(form);
  const u=activeUser();
  const oldEmail=String(u.email||"").toLowerCase();
  db.settings.company=fd.get("company");
  db.settings.workspace=fd.get("workspace");
  db.settings.userName=fd.get("userName");
  const newEmail=String(fd.get("email")||"").trim().toLowerCase();
  db.settings.email=newEmail;
  const oldP=fd.get("oldPass"), n1=fd.get("newPass"), n2=fd.get("newPass2");
  let newPass=u.password||db.settings.password;
  if(n1||n2||oldP){
    if(oldP!==(u.password||db.settings.password)){toast("Mevcut şifre hatalı",true);return}
    if(n1.length<6){toast("Yeni şifre en az 6 karakter",true);return}
    if(n1!==n2){toast("Yeni şifreler eşleşmiyor",true);return}
    newPass=n1;
    db.settings.password=n1;
  }
  db.users=(db.users||[]).map(x=>{
    if(String(x.email).toLowerCase()!==oldEmail) return x;
    return {...x,name:fd.get("userName"),email:newEmail,password:newPass};
  });
  if(newEmail) setSession(newEmail);
  saveDb(); renderApp(); toast("Ayarlar güncellendi");
}
function setTheme(t){db.settings.theme=t;saveDb();renderApp();toast("Tema uygulandı")}

let aiLog=[{role:"bot",text:"Mıcır Ocağı ERP asistanıyım. Dashboard, kantar fişi, cari Excel, tesis duruşu, çek, finans ve ayarlar dahil tüm modülleri biliyorum. Güncel kayıtlarınıza da bakabilirim."}];
function viewAsistan(){
  return `
  <div class="page-head"><div class="page-head-copy">
    <div class="page-eyebrow">Sistem</div><h1>Asistan</h1>
    <p class="page-sub">Uygulamanın sayfaları, alanları ve elinizdeki veri özeti.</p>
  </div></div>
  <div class="ai-wrap">
    <div class="card ai-chat">
      <div class="ai-log" id="aiLog">${aiLog.map(m=>`<div class="ai-msg ${m.role}">${esc(m.text)}</div>`).join("")}</div>
      <form class="ai-input" onsubmit="event.preventDefault();askAI(this)">
        <input class="inp" name="q" placeholder="Örn. bugün kaç ton çıktı? kantar fişi nasıl kesilir?" required>
        <button class="btn btn-p">Gönder</button>
      </form>
    </div>
    <div class="card" style="padding:16px">
      <div class="section-label" style="margin-top:0">Hızlı sorular</div>
      ${["Kantar fişi nasıl kesilir?","Cari bakiyesi nasıl hesaplanır?","Toplu Excel nereden alınır?","Çalışılmayan süre nereye yazılır?","Çek tahsil edilince ne olur?","Şifreyi nasıl değiştiririm?"].map(q=>`<button class="btn btn-s" style="width:100%;margin-bottom:6px;white-space:normal;text-align:left" onclick="askAIText('${q.replace(/'/g,"")}')">${q}</button>`).join("")}
    </div>
  </div>`;
}
function askAI(form){const q=form.q.value.trim();form.reset();askAIText(q)}
function askAIText(q){
  aiLog.push({role:"user",text:q});
  aiLog.push({role:"bot",text:answerAI(q)});
  renderApp();
  const log=document.getElementById("aiLog"); if(log) log.scrollTop=log.scrollHeight;
}
function answerAI(q){
  const s=q.toLowerCase();
  const tonaj=db.fisler.reduce((a,f)=>a+Number(f.net||0),0);
  const satis=db.fisler.reduce((a,f)=>a+fisTutar(f),0);
  const alacak=db.cariler.reduce((a,c)=>a+Math.max(0,cariBakiye(c.id)),0);
  if(/nasıl|nereye|nereden|kılavuz|kilavuz/.test(s) && /kantar|fiş|fis/.test(s))
    return "Kantar Fişleri › Yeni fiş. Plaka, cari, malzeme, 1. tartım (brüt) ve 2. tartım (dara) girilir. Net tonaj otomatik çıkar. Birim fiyat ayrı satırdadır. Kaydet deyince gerçek kantar fişi önizlemesi açılır; Yazdır ile çıktı alınır.";
  if(/excel|aktar|indir/.test(s) && /cari/.test(s))
    return "Cari satırındaki indirme ikonu o carinin kartını, satışlarını ve finans hareketlerini çok sayfalı Excel’e yazar. Listedeki Toplu Excel ise tüm cari özetini ve bütün satışları iki sayfada verir.";
  if(/bakiye/.test(s))
    return "Cari bakiye = açılış + kantar satış tutarları − tahsilat + ödeme − tahsil edilmiş çekler. Detay için cari unvanına tıklayın.";
  if(/çalışılmayan|calisilmayan|tesis|duruş|durus/.test(s))
    return "Tesis Çalışma sayfasında süre alanı Çalışılmayan süre’dir. Yeni kayıtta saati elle girin: 01:30 veya 1.5. Neden (bakım, arıza…) ve açıklama eklenir.";
  if(/çek|cek/.test(s))
    return "Çekler sayfasından numara, banka, cari, tutar, keşide ve vade girilir. Durumlar: Portföy, Tahsil, Ciro, İade, Karşılıksız. Tahsil, ilgili cari bakiyesini düşürür.";
  if(/şifre|sifre|e-posta|email|mail|ayar/.test(s))
    return "Ayarlar › Hesap / e-posta. Mevcut şifreyi yazıp yeni şifreyi iki kez girin. Tema aynı sayfada Tema sekmesindedir. Kılavuz ve Hakkında da oradadır.";
  if(/dashboard|özet|ozet|rapor|kaç|kac|toplam|ton/.test(s))
    return `Güncel özet: ${db.fisler.length} kantar fişi, ${tonaj.toFixed(3)} ton, satış ${money(satis)}, cari alacak ${money(alacak)}, ${db.cariler.length} cari, ${db.cekler.length} çek, ${db.tesis.length} tesis duruş kaydı.`;
  if(/malzeme|mıcır|micir|fiyat/.test(s))
    return "Malzemeler sayfasından ürün ve varsayılan birim fiyat tanımlanır. Kantar fişinde malzeme seçilince birim fiyat gelir, fişte değiştirilebilir.";
  if(/yedek|backup|silin/.test(s))
    return "Sol alt Yedek al JSON indirir. Ayarlar › Hakkında › Yedek yükle ile geri gelir. Veri tarayıcı localStorage anahtarı micir_erp_v2 üzerindedir.";
  if(/finans|tahsilat|ödeme|odeme/.test(s))
    return "Finans sayfasına tahsilat veya ödeme yazılır. Tahsilat bakiyeyi azaltır, ödeme artırır. Yöntem: nakit, havale, kart, mahsup.";
  if(/menü|menu|sayfa|modul|modül/.test(s))
    return "Yan menü grupları — Operasyon: Dashboard, Kantar Fişleri, Malzemeler, Tesis Çalışma. Ticari: Cariler, Finans, Çekler. Sistem: Ayarlar, Asistan. Üstte açık sayfalar sekme olarak durur.";
  return `Soruyu uygulama bağlamında yanıtladım.\n\nCanlı veri: ${db.fisler.length} fiş · ${tonaj.toFixed(3)} t · satış ${money(satis)} · alacak ${money(alacak)} · ${db.cekler.filter(c=>c.durum==="Portföy").length} portföy çek.\n\nDaha net sorabilirsiniz: kantar önizleme, cari Excel, çalışılmayan süre, çek tahsil, tema, şifre.`;
}

function render(){
  loadDb();
  applyTheme();
  if(!loggedIn()) renderAuth();
  else renderApp();
}
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
